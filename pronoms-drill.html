, {"id": "q079", "topic": "Indéfinis", "skill": "personne / rien", "prompt": "J’ai appelé trois personnes, mais ___ n’a répondu.", "answer": "personne", "alts": [], "why": "Aucune personne → personne."}, {"id": "q080", "topic": "Indéfinis", "skill": "personne / rien", "prompt": "Je n’ai ___ compris à cette explication.", "answer": "rien", "alts": [], "why": "Aucune chose → rien."}, {"id": "q081", "topic": "Indéfinis", "skill": "aucun / aucune", "prompt": "J’ai essayé plusieurs options ; ___ ne me convient.", "answer": "aucune", "alts": [], "why": "option → féminin → aucune."}, {"id": "q082", "topic": "Indéfinis", "skill": "chacun / chacune", "prompt": "Il y avait plusieurs candidats ; ___ avait une expérience différente.", "answer": "chacun", "alts": [], "why": "Chaque individu séparément → chacun."}, {"id": "q083", "topic": "Indéfinis", "skill": "quelqu’un / quelque chose", "prompt": "___ a laissé son téléphone sur la table.", "answer": "quelqu’un", "alts": [], "why": "Personne non identifiée."}, {"id": "q084", "topic": "Indéfinis", "skill": "quelqu’un / quelque chose", "prompt": "Il y a ___ d’étrange dans cette histoire.", "answer": "quelque chose", "alts": [], "why": "Chose indéterminée."}, {"id": "q085", "topic": "Indéfinis", "skill": "certains / certaines", "prompt": "J’ai testé dix applications ; ___ étaient vraiment utiles.", "answer": "certaines", "alts": [], "why": "applications → féminin pluriel."}, {"id": "q086", "topic": "Indéfinis", "skill": "plusieurs", "prompt": "Beaucoup ont essayé ; ___ ont réussi.", "answer": "plusieurs", "alts": [], "why": "Sous-groupe pluriel indéfini."}, {"id": "q087", "topic": "Indéfinis", "skill": "certains / d’autres", "prompt": "___ préfèrent travailler seuls, d’autres en équipe.", "answer": "certains", "alts": [], "why": "Paire certains… d’autres."}, {"id": "q088", "topic": "Indéfinis", "skill": "l’un / l’autre", "prompt": "J’ai deux solutions : ___ est rapide, l’autre est moins chère.", "answer": "l’une", "alts": [], "why": "solutions → féminin : l’une… l’autre."}, {"id": "q089", "topic": "Indéfinis", "skill": "tout / tous / toutes", "prompt": "Ils avaient des opinions différentes, mais ___ étaient d’accord.", "answer": "tous", "alts": [], "why": "Groupe masculin/mixte → tous."}, {"id": "q090", "topic": "Indéfinis", "skill": "tout / tous / toutes", "prompt": "Les portes étaient ouvertes ; ___ donnaient sur le jardin.", "answer": "toutes", "alts": [], "why": "Groupe féminin pluriel → toutes."}, {"id": "q091", "topic": "Indéfinis", "skill": "n’importe qui", "prompt": "___ peut apprendre une langue avec assez de temps.", "answer": "n’importe qui", "alts": [], "why": "Toute personne sans distinction."}, {"id": "q092", "topic": "Indéfinis", "skill": "n’importe quoi", "prompt": "Tu peux choisir ___. (= n’importe quelle chose)", "answer": "n’importe quoi", "alts": [], "why": "Toute chose sans distinction."}]; const $=s=>document.querySelector(s); const norm=s=>s.trim().toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[’]/g,"'").replace(/[.!?]+$/,"").replace(/\s+/g," ");
let store=JSON.parse(localStorage.getItem("pronomsV2")||'{"items":{},"sessions":0}'), S;
const topics=[...new Set(BANK.map(x=>x.topic))];
$("#topics").innerHTML=topics.map(t=>`<button class=topic onclick='topic(${JSON.stringify(t)})'><b>${t}</b><span class=muted>${BANK.filter(x=>x.topic===t).length} exemples · pratique libre</span></button>`).join("");
function rec(q){return store.items[q.id]||{seen:0,ok:0,bad:0,hints:0,last:0}} function save(){localStorage.setItem("pronomsV2",JSON.stringify(store))}
function ranked(pool){return [...pool].sort((a,b)=>{let A=rec(a),B=rec(b);return ((B.seen?0:100)+B.bad*8-B.ok*2)-((A.seen?0:100)+A.bad*8-A.ok*2)||Math.random()-.5})}
function launch(pool,n,name,inf,topicName=null){S={q:ranked(pool).slice(0,n||pool.length),i:0,ok:0,h:0,answered:0,inf,topic:topicName};$("#mode").textContent=name;$("#desc").textContent=inf?"Termine quand tu veux.":"Session courte.";view("quiz");show()}
function daily(){launch(BANK,20,"Mix du jour",false)} function endless(){launch(BANK,BANK.length,"Free drill",true)} function topic(t){let p=BANK.filter(x=>x.topic===t);launch(p,p.length,t,true,t)}
function view(x){["home","quiz","results"].forEach(y=>$("#"+y).classList.toggle("hidden",x!==y))}
function show(){if(S.i>=S.q.length){if(S.inf){let p=S.topic?BANK.filter(x=>x.topic===S.topic):BANK;S.q.push(...ranked(p))}else return finish()}let q=S.q[S.i];q.usedHint=false;$("#prompt").textContent=q.prompt;$("#count").textContent=S.inf?`Question ${S.i+1}`:`${S.i+1} / ${S.q.length}`;$("#prog").style.width=S.inf?"0%":`${S.i/S.q.length*100}%`;$("#answer").value="";$("#answer").disabled=false;$("#check").disabled=false;$("#feedback").classList.add("hidden");$("#hint").classList.add("hidden");$("#hintBtn").disabled=false;$("#answer").focus()}
function hint(){let q=S.q[S.i];q.usedHint=true;S.h++;$("#hint").textContent="Indice : "+q.skill;$("#hint").classList.remove("hidden");$("#hintBtn").disabled=true}
function checkAnswer(){let q=S.q[S.i],a=norm($("#answer").value);if(!a)return;let ok=[q.answer,...q.alts].map(norm).includes(a),r=rec(q);r.seen++;r.last=Date.now();S.answered++;if(ok){r.ok++;S.ok++;$("#verdict").textContent="✓ Oui.";$("#verdict").className="good"}else{r.bad++;$("#verdict").textContent="✕ "+q.answer;$("#verdict").className="bad";let same=BANK.filter(x=>x.skill===q.skill&&x.id!==q.id);if(same.length)S.q.splice(Math.min(S.i+4,S.q.length),0,same[Math.floor(Math.random()*same.length)])}if(q.usedHint)r.hints++;store.items[q.id]=r;save();$("#why").textContent=q.why;$("#feedback").classList.remove("hidden");$("#answer").disabled=true;$("#check").disabled=true}
function next(){S.i++;show()} function finish(){if(!S||!S.answered)return goHome();store.sessions++;save();view("results");$("#score").textContent=Math.round(S.ok/S.answered*100)+"%";$("#answered").textContent=S.answered;$("#hints").textContent=S.h}
function goHome(){view("home");hist()} function hist(){$("#history").textContent=`${Object.keys(store.items).length} / ${BANK.length} vues · ${store.sessions} sessions`} $("#answer").addEventListener("keydown",e=>{if(e.key==="Enter"&&!$("#check").disabled)checkAnswer()});hist();
</script></body></html>
