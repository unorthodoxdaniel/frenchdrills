<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TCF · Tâche 3 — Fiches d'argumentation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F5F3EE;
    --paper-raised:#FBFAF7;
    --ink:#1C1B1F;
    --ink-soft:#5B5850;
    --line:#DAD4C4;
    --line-soft:#E8E3D6;
    --pine:#2F5D62;
    --pine-deep:#234548;
    --pine-tint:#E4EDEC;
    --amber:#A8763E;
    --amber-tint:#F3E9DA;
    --clay:#A8483E;
    --clay-deep:#7E362F;
    --clay-tint:#F4E4E1;
    --radius:10px;
    --shadow:0 1px 2px rgba(28,27,31,0.06), 0 4px 16px rgba(28,27,31,0.05);
    font-size:16px;
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:'Inter',system-ui,sans-serif;
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:840px;margin:0 auto;padding:28px 20px 80px;}

  /* ---------- header ---------- */
  header.top{
    display:flex;justify-content:space-between;align-items:baseline;
    gap:16px;flex-wrap:wrap;
    margin-bottom:28px;
  }
  .brand{display:flex;flex-direction:column;gap:2px;}
  .brand .eyebrow{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;letter-spacing:.08em;text-transform:uppercase;
    color:var(--pine);
  }
  .brand h1{
    font-family:'Fraunces',serif;font-weight:600;font-size:1.5rem;margin:0;
  }
  .search-box{position:relative;}
  .search-box input{
    font-family:'Inter',sans-serif;
    font-size:14px;
    padding:9px 14px 9px 34px;
    border:1px solid var(--line);
    border-radius:999px;
    background:var(--paper-raised);
    color:var(--ink);
    width:230px;
    outline-offset:2px;
  }
  .search-box input:focus-visible{outline:2px solid var(--pine);}
  .search-box svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);opacity:.5;pointer-events:none;}
  .search-box input::placeholder{color:var(--ink-soft);}

  /* ---------- hero / today's card ---------- */
  .hero{
    background:var(--paper-raised);
    border:1px solid var(--line);
    border-left:5px solid var(--pine);
    border-radius:var(--radius);
    box-shadow:var(--shadow);
    padding:26px 26px 22px;
    position:relative;
  }
  .hero.simple{
    border-left-color:var(--amber);
    padding:20px 22px 18px;
  }
  .hero.simple h2{font-size:1.15rem;}
  @keyframes flashCard{
    0%{box-shadow:0 0 0 3px var(--pine);}
    100%{box-shadow:var(--shadow);}
  }
  .hero.flash{animation:flashCard 900ms ease-out;}
  @media (prefers-reduced-motion:reduce){
    .hero.flash{animation:none;}
  }
  .cards-row{
    display:grid;grid-template-columns:1.3fr 1fr;gap:18px;
    margin-bottom:36px;align-items:start;
  }
  @media (max-width:760px){
    .cards-row{grid-template-columns:1fr;}
  }
  .hero-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:14px;}
  .hero-label{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;letter-spacing:.09em;text-transform:uppercase;
    color:var(--amber);
    display:flex;align-items:center;gap:8px;
  }
  .hero.simple .hero-label{color:var(--ink-soft);}
  .hero-progress{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;color:var(--ink-soft);
  }
  .hero-theme{
    font-family:'IBM Plex Mono',monospace;
    font-size:12px;letter-spacing:.04em;text-transform:uppercase;
    color:var(--pine);margin-bottom:6px;
  }
  .hero h2{
    font-family:'Fraunces',serif;font-weight:600;
    font-size:1.5rem;line-height:1.25;margin:0 0 12px;
  }
  .hero .argument{
    font-size:.98rem;color:var(--ink-soft);
    border-left:2px solid var(--line);
    padding-left:12px;margin:0 0 18px;
    font-style:italic;
  }
  .hero .qlist{margin-top:4px;}
  .hero-actions{
    display:flex;gap:10px;margin-top:20px;flex-wrap:wrap;
  }

  button.btn{
    font-family:'Inter',sans-serif;font-size:13px;font-weight:600;
    padding:9px 16px;border-radius:999px;border:1px solid var(--line);
    background:var(--paper);color:var(--ink);cursor:pointer;
    transition:background .15s, border-color .15s;
  }
  button.btn:hover{background:var(--line-soft);}
  button.btn:focus-visible{outline:2px solid var(--pine);outline-offset:2px;}
  button.btn.primary{
    background:var(--pine);border-color:var(--pine);color:#fff;
  }
  button.btn.primary:hover{background:var(--pine-deep);}

  /* ---------- question rows ---------- */
  .qrow{
    border-top:1px solid var(--line-soft);
    padding:12px 0;
  }
  .qrow:first-child{border-top:none;}
  .qhead{
    display:flex;align-items:flex-start;gap:10px;cursor:pointer;
    -webkit-tap-highlight-color:transparent;
  }
  .qhead:focus-visible{outline:2px solid var(--pine);outline-offset:2px;border-radius:4px;}
  .freq{
    font-family:'IBM Plex Mono',monospace;font-size:12px;font-weight:500;
    color:var(--amber);background:var(--amber-tint);
    padding:2px 7px;border-radius:5px;white-space:nowrap;flex-shrink:0;
    margin-top:2px;
  }
  .qtext{flex:1;font-size:.95rem;}
  .chev{
    flex-shrink:0;margin-top:4px;color:var(--ink-soft);
    transition:transform .15s;
  }
  .qrow.open .chev{transform:rotate(90deg);}
  .qdetail{
    display:none;
    margin:10px 0 2px 46px;
    font-size:.85rem;color:var(--ink-soft);
  }
  .qrow.open .qdetail{display:block;}
  .qdetail .canon-dates{
    font-family:'IBM Plex Mono',monospace;font-size:.78rem;
    margin-bottom:6px;
  }
  .qdetail .variant{margin-bottom:6px;padding-left:12px;border-left:2px solid var(--line-soft);}
  .qdetail .variant .vtext{font-style:italic;}
  .qdetail .variant .vdates{font-family:'IBM Plex Mono',monospace;font-size:.76rem;display:block;margin-top:2px;}

  /* ---------- pour/contre ---------- */
  .pc-toggle{
    display:inline-flex;align-items:center;gap:5px;
    font-family:'Inter',sans-serif;font-size:11.5px;font-weight:600;
    padding:4px 10px;border-radius:999px;border:1px solid var(--line);
    background:var(--paper);color:var(--ink-soft);cursor:pointer;
    margin-left:46px;margin-top:2px;
  }
  .pc-toggle:hover{border-color:var(--pine);color:var(--pine);}
  .pc-toggle:focus-visible{outline:2px solid var(--pine);outline-offset:2px;}
  .pc-toggle .pc-chev{width:10px;height:10px;transition:transform .15s;}
  .pc-toggle.open .pc-chev{transform:rotate(90deg);}
  .pc-panel{
    display:none;margin:8px 0 4px 46px;
    grid-template-columns:1fr 1fr;gap:12px;
  }
  .pc-panel.open{display:grid;}
  @media (max-width:600px){ .pc-panel.open{grid-template-columns:1fr;} .pc-toggle{margin-left:0;} .pc-panel{margin-left:0;} }
  .pc-col{border-radius:8px;padding:10px 12px;font-size:.83rem;}
  .pc-col.pour{background:var(--pine-tint);border:1px solid #C9DCDA;}
  .pc-col.contre{background:var(--clay-tint);border:1px solid #E7CFC8;}
  .pc-col-label{
    font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;
    display:flex;align-items:center;gap:5px;margin-bottom:6px;font-weight:600;
  }
  .pc-col.pour .pc-col-label{color:var(--pine-deep);}
  .pc-col.contre .pc-col-label{color:var(--clay-deep);}
  .pc-col ul{margin:0;padding-left:16px;}
  .pc-col li{margin-bottom:4px;line-height:1.4;}
  .pc-col li::marker{color:inherit;}

  /* ---------- index ---------- */
  .index-heading{
    font-family:'IBM Plex Mono',monospace;
    font-size:12px;letter-spacing:.08em;text-transform:uppercase;
    color:var(--ink-soft);margin:0 0 14px;
  }
  .theme{
    border:1px solid var(--line);
    border-radius:var(--radius);
    background:var(--paper-raised);
    margin-bottom:10px;
    overflow:hidden;
  }
  .theme-head{
    display:flex;justify-content:space-between;align-items:center;
    padding:14px 18px;cursor:pointer;gap:12px;
    -webkit-tap-highlight-color:transparent;
  }
  .theme-head:focus-visible{outline:2px solid var(--pine);outline-offset:-2px;}
  .theme-head h3{
    font-family:'Fraunces',serif;font-weight:600;font-size:1.05rem;margin:0;
  }
  .theme-meta{
    font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--ink-soft);
    white-space:nowrap;
  }
  .theme-chev{color:var(--ink-soft);transition:transform .15s;flex-shrink:0;}
  .theme.open .theme-chev{transform:rotate(90deg);}
  .theme-body{display:none;border-top:1px solid var(--line-soft);}
  .theme.open .theme-body{display:block;}

  .cluster{border-top:1px solid var(--line-soft);}
  .cluster:first-child{border-top:none;}
  .cluster-head{
    display:flex;justify-content:space-between;align-items:center;
    padding:12px 18px;cursor:pointer;gap:12px;
  }
  .cluster-head:focus-visible{outline:2px solid var(--pine);outline-offset:-2px;}
  .cluster-head span.cname{font-size:.92rem;font-weight:500;}
  .cluster-meta{
    font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--amber);
    white-space:nowrap;
  }
  .show-card-btn{
    width:24px;height:24px;border-radius:6px;border:1px solid transparent;
    display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;
    color:var(--ink-soft);cursor:pointer;background:none;
    transition:background .15s,color .15s,border-color .15s;
  }
  .show-card-btn:hover{background:var(--line-soft);color:var(--pine);border-color:var(--line);}
  .show-card-btn:focus-visible{outline:2px solid var(--pine);outline-offset:1px;}
  .show-card-btn svg{width:14px;height:14px;}
  .show-card-btn.simple:hover{color:var(--amber);}
  .cluster-chev{color:var(--ink-soft);transition:transform .15s;flex-shrink:0;}
  .cluster.open .cluster-chev{transform:rotate(90deg);}
  .cluster-body{display:none;padding:6px 18px 16px 18px;}
  .cluster.open .cluster-body{display:block;}
  .cluster-arg{
    font-size:.85rem;color:var(--ink-soft);font-style:italic;
    border-left:2px solid var(--line);padding-left:12px;margin:2px 0 10px;
  }

  .standalone-block{padding:6px 18px 16px;}
  .standalone-title{
    font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.06em;
    text-transform:uppercase;color:var(--ink-soft);margin:8px 0 6px;
  }

  mark{background:var(--amber-tint);color:inherit;border-radius:3px;padding:0 2px;}

  .no-results{
    text-align:center;color:var(--ink-soft);font-size:.9rem;padding:30px 0;display:none;
  }

  /* ---------- covered state ---------- */
  .cover-toggle{
    display:inline-flex;align-items:center;gap:6px;
    font-family:'Inter',sans-serif;font-size:12.5px;font-weight:600;
    padding:7px 13px;border-radius:999px;border:1px solid var(--line);
    background:var(--paper);color:var(--ink-soft);cursor:pointer;
    flex-shrink:0;transition:background .15s,border-color .15s,color .15s;
  }
  .cover-toggle:hover{border-color:var(--pine);}
  .cover-toggle:focus-visible{outline:2px solid var(--pine);outline-offset:2px;}
  .cover-toggle.done{
    background:var(--pine);border-color:var(--pine);color:#fff;
  }
  .cover-toggle .dot{
    width:14px;height:14px;border-radius:50%;border:1.5px solid currentColor;
    display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;
  }
  .cover-toggle.done .dot{background:#fff;color:var(--pine);}
  .cover-toggle .dot svg{display:none;width:9px;height:9px;}
  .cover-toggle.done .dot svg{display:block;}

  .cluster.covered{background:var(--pine-tint);}
  .cluster.covered .cluster-head span.cname{color:var(--pine-deep);}
  .cluster-check{
    width:18px;height:18px;border-radius:50%;border:1.5px solid var(--line);
    display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;
    cursor:pointer;color:transparent;transition:background .15s,border-color .15s,color .15s;
  }
  .cluster-check:hover{border-color:var(--pine);}
  .cluster-check:focus-visible{outline:2px solid var(--pine);outline-offset:2px;}
  .cluster-check.done{background:var(--pine);border-color:var(--pine);color:#fff;}
  .cluster-check svg{width:11px;height:11px;}

  .simple-check{
    width:16px;height:16px;border-radius:50%;border:1.5px solid var(--line);
    display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;
    cursor:pointer;color:transparent;transition:background .15s,border-color .15s,color .15s;
    margin-top:2px;
  }
  .simple-check:hover{border-color:var(--amber);}
  .simple-check:focus-visible{outline:2px solid var(--amber);outline-offset:2px;}
  .simple-check.done{background:var(--amber);border-color:var(--amber);color:#fff;}
  .simple-check svg{width:10px;height:10px;}
  .qrow.covered-simple{opacity:.6;}
  .qrow.covered-simple .qtext{text-decoration:line-through;text-decoration-color:var(--amber);}

  .progress-bar-wrap{
    display:flex;align-items:center;gap:14px;margin:2px 0 18px;flex-wrap:wrap;
  }
  .progress-item{display:flex;align-items:center;gap:8px;flex:1;min-width:180px;}
  .progress-track{
    flex:1;height:6px;border-radius:999px;background:var(--line-soft);overflow:hidden;
  }
  .progress-fill{
    height:100%;background:var(--pine);border-radius:999px;transition:width .3s;
  }
  .progress-fill.simple{background:var(--amber);}
  .progress-label{
    font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--ink-soft);white-space:nowrap;
  }

  .index-toolbar{
    display:flex;justify-content:space-between;align-items:center;
    margin-bottom:14px;flex-wrap:wrap;gap:10px;
  }
  .hide-covered-label{
    display:flex;align-items:center;gap:7px;
    font-size:13px;color:var(--ink-soft);cursor:pointer;user-select:none;
  }
  .hide-covered-label input{accent-color:var(--pine);width:15px;height:15px;cursor:pointer;}

  .all-done{
    text-align:center;padding:20px 10px;color:var(--pine-deep);font-size:.92rem;
  }

  footer{
    margin-top:40px;text-align:center;font-size:.78rem;color:var(--ink-soft);
  }
  footer .reset-link{
    color:var(--ink-soft);text-decoration:underline;cursor:pointer;background:none;border:none;
    font:inherit;padding:0;margin-left:4px;
  }

  @media (max-width:600px){
    .search-box input{width:100%;}
    header.top{flex-direction:column;align-items:stretch;}
    .hero{padding:20px 18px 18px;}
    .qdetail{margin-left:0;}
  }

  @media (prefers-reduced-motion:reduce){
    *{transition:none !important;scroll-behavior:auto !important;}
  }
</style>
</head>

<script>(function(){
  const raw = JSON.parse(document.getElementById('siteData').textContent);

  const STORAGE_KEY = 'tcf_t3_covered_v1';
  const STORAGE_KEY_SIMPLE = 'tcf_t3_covered_simple_v1';

  // ---------- storage ----------
  let storageOK = true;
  function loadCovered(){
    try{
      const raw = localStorage.getItem(STORAGE_KEY);
      return new Set(raw ? JSON.parse(raw) : []);
    }catch(e){ storageOK = false; return new Set(); }
  }
  function saveCovered(set){
    try{ localStorage.setItem(STORAGE_KEY, JSON.stringify([...set])); }
    catch(e){ storageOK = false; }
  }
  let covered = loadCovered();

  let storageOKSimple = true;
  function loadCoveredSimple(){
    try{
      const raw = localStorage.getItem(STORAGE_KEY_SIMPLE);
      return new Set(raw ? JSON.parse(raw) : []);
    }catch(e){ storageOKSimple = false; return new Set(); }
  }
  function saveCoveredSimple(set){
    try{ localStorage.setItem(STORAGE_KEY_SIMPLE, JSON.stringify([...set])); }
    catch(e){ storageOKSimple = false; }
  }
  let coveredSimple = loadCoveredSimple();
  function isCoveredSimple(id){ return coveredSimple.has(id); }
  function toggleCoveredSimple(id){
    if(coveredSimple.has(id)) coveredSimple.delete(id); else coveredSimple.add(id);
    saveCoveredSimple(coveredSimple);
    updateProgress();
  }

  function isCovered(id){ return covered.has(id); }
  function toggleCovered(id){
    if(covered.has(id)) covered.delete(id); else covered.add(id);
    saveCovered(covered);
    updateProgress();
  }

  function allClusterIds(){
    const ids = [];
    THEMES.forEach(t => t.clusters.forEach(c => ids.push(c.id)));
    return ids;
  }
  function updateProgress(){
    const ids = allClusterIds();
    const done = ids.filter(id => covered.has(id)).length;
    const pct = ids.length ? Math.round(100*done/ids.length) : 0;
    document.getElementById('progressFill').style.width = pct + '%';
    document.getElementById('progressLabel').textContent = `${done} / ${ids.length} groupes`;

    const sIds = [];
    THEMES.forEach(t => t.standalone.forEach(q => sIds.push(q.id)));
    const sDone = sIds.filter(id => coveredSimple.has(id)).length;
    const sPct = sIds.length ? Math.round(100*sDone/sIds.length) : 0;
    document.getElementById('progressFillSimple').style.width = sPct + '%';
    document.getElementById('progressLabelSimple').textContent = `${sDone} / ${sIds.length} questions isolées`;

    document.querySelectorAll('.cluster[data-id]').forEach(el => {
      const on = covered.has(el.dataset.id);
      el.classList.toggle('covered', on);
      const chk = el.querySelector('.cluster-check');
      if(chk) chk.classList.toggle('done', on);
    });
    document.querySelectorAll('.qrow[data-simple-id]').forEach(el => {
      const on = coveredSimple.has(el.dataset.simpleId);
      el.classList.toggle('covered-simple', on);
      const chk = el.querySelector('.simple-check');
      if(chk) chk.classList.toggle('done', on);
    });

  function stripArgLabel(s){ return s.replace(/^Argument central\s*:\s*/i, ''); }
  function escapeHtml(s){
    return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }
  function highlight(text, term){
    if(!term) return escapeHtml(text);
    const esc = escapeHtml(text);
    const t = term.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
    return esc.replace(new RegExp('('+t+')','ig'), '<mark>$1</mark>');
  }

  // ---------- pour / contre ----------
  function pcBlockHTML(pc, uid){

  // ---------- question row ----------

          ${q.dates ? `<div class="canon-dates">📅 ${escapeHtml(q.dates)}</div>` : ''}

            <div class="variant">
              <span class="vtext">${escapeHtml(v.text)}</span>
              <span class="vdates">📅 ${escapeHtml(v.dates)}</span>
            </div>`).join('')}
        </div>` : ''}
        ${simpleId ? pcBlockHTML(q.pourContre, 'idx-'+simpleId) : ''}
      </div>`;
  }
  function wireQuestionRows(container){
    container.querySelectorAll('.qhead').forEach(head => {

    container.querySelectorAll('[data-show-simple]').forEach(btn => {

        e.stopPropagation();
        const [ti, si] = btn.dataset.showSimple.split(':').map(Number);
        showStandaloneAsCard(ti, si);

  }
  function toggleQ(head){
    const row = head.closest('.qrow');
    const open = row.classList.toggle('open');
    head.setAttribute('aria-expanded', open ? 'true' : 'false');
  }

  // ---------- hero ----------
  let heroMode = 'today';
  let heroPick = null;

  function findTodayIdx(){
    const epoch = new Date(2025,0,1);
    const now = new Date();
    const days = Math.floor((new Date(now.getFullYear(),now.getMonth(),now.getDate()) - epoch) / 86400000);
    const start = ((days % ROTATION.length) + ROTATION.length) % ROTATION.length;
    // walk forward through rotation, skipping covered clusters, wrap once
    for(let step=0; step<ROTATION.length; step++){
      const idx = (start + step) % ROTATION.length;
      const entry = ROTATION[idx];
      const cluster = THEMES[entry.themeIndex].clusters[entry.clusterIndex];
      if(!isCovered(cluster.id)) return {rotIdx: idx, baseIdx: start};
    }
    return null; // everything covered
  }

  function rotationIndexFor(themeIndex, clusterIndex){
    return ROTATION.findIndex(e => e.themeIndex === themeIndex && e.clusterIndex === clusterIndex);
  }
  function simpleRotationIndexFor(themeIndex, standaloneIndex){
    return STANDALONE_ROTATION.findIndex(e => e.themeIndex === themeIndex && e.standaloneIndex === standaloneIndex);
  }
  function flashHero(el){
    el.classList.remove('flash');
    void el.offsetWidth; // restart animation
    el.classList.add('flash');
  }
  function showClusterAsCard(themeIndex, clusterIndex){
    const idx = rotationIndexFor(themeIndex, clusterIndex);
    if(idx === -1) return;
    heroPick = idx; heroMode = 'random';
    renderHero();
    const hero = document.getElementById('heroCard');
    if(typeof hero.scrollIntoView === 'function') hero.scrollIntoView({behavior:'smooth', block:'start'});
    flashHero(hero);
  }
  function showStandaloneAsCard(themeIndex, standaloneIndex){
    const idx = simpleRotationIndexFor(themeIndex, standaloneIndex);
    if(idx === -1) return;
    heroSimplePick = idx; heroSimpleMode = 'random';
    renderHeroSimple();
    const hero = document.getElementById('heroCardSimple');
    if(typeof hero.scrollIntoView === 'function') hero.scrollIntoView({behavior:'smooth', block:'start'});
    flashHero(hero);
  }

  function renderHero(){
    const hero = document.getElementById('heroCard');
    let rotEntry, dayLabel, isToday, clusterObj;

    if(heroMode === 'today'){
      const found = findTodayIdx();
      if(!found){
        hero.innerHTML = `<div class="all-done">🎉 Toutes les fiches sont couvertes ! Réinitialisez la progression pour recommencer, ou utilisez « Piocher une autre carte » pour réviser librement.
          <div class="hero-actions" style="justify-content:center;"><button class="btn primary" id="drawBtn">🎴 Piocher une carte</button></div></div>`;
        document.getElementById('drawBtn').addEventListener('click', () => {
          heroPick = Math.floor(Math.random()*ROTATION.length); heroMode='random'; renderHero();
        });
        return;
      }
      rotEntry = ROTATION[found.rotIdx];
      dayLabel = `Jour ${found.baseIdx+1} / ${ROTATION.length}`;
      isToday = true;
    } else {
      rotEntry = ROTATION[heroPick];
      dayLabel = `Carte ${heroPick+1} / ${ROTATION.length}`;
      isToday = false;
    }
    const theme = THEMES[rotEntry.themeIndex];
    const cluster = theme.clusters[rotEntry.clusterIndex];
    clusterObj = cluster;
    const done = isCovered(cluster.id);

    hero.innerHTML = `
      <div class="hero-top">
        <span class="hero-label">${isToday ? '✦ Fiche du jour' : '✦ Pioche libre'}</span>
        <span class="hero-progress">${dayLabel}</span>
      </div>
      <div class="hero-theme">${escapeHtml(theme.header)}</div>
      <h2>${escapeHtml(cluster.name)}</h2>
      <p class="argument">${escapeHtml(stripArgLabel(cluster.argument))}</p>
      ${pcBlockHTML(cluster.pourContre, 'hero-'+cluster.id)}
      <div class="qlist" id="heroQlist"></div>
      <div class="hero-actions">
        <button class="cover-toggle ${done?'done':''}" id="heroCoverBtn">
          <span class="dot"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><polyline points="20 6 9 17 4 12"/></svg></span>
          ${done ? 'Couvert' : 'Marquer comme couvert'}
        </button>
        <button class="btn primary" id="drawBtn">🎴 Piocher une autre carte</button>
        ${!isToday ? '<button class="btn" id="backTodayBtn">↩ Revenir à la fiche du jour</button>' : ''}
      </div>
    `;
    const qlist = document.getElementById('heroQlist');
    qlist.innerHTML = cluster.questions.map((q,i) => questionRowHTML(q, 'hero', i, '')).join('');
    wireQuestionRows(qlist);
    wirePcToggles(hero);

    document.getElementById('heroCoverBtn').addEventListener('click', () => {
      toggleCovered(cluster.id);
      renderHero();
      renderIndex(currentSearchTerm());
    });
    document.getElementById('drawBtn').addEventListener('click', () => {
      let n;
      do { n = Math.floor(Math.random()*ROTATION.length); } while(n === heroPick && ROTATION.length > 1);
      heroPick = n; heroMode = 'random';
      renderHero();
      if(typeof hero.scrollIntoView === 'function') hero.scrollIntoView({behavior:'smooth', block:'start'});
    });
    const backBtn = document.getElementById('backTodayBtn');
    if(backBtn) backBtn.addEventListener('click', () => { heroMode = 'today'; renderHero(); });
  }

  // ---------- hero simple (standalone questions) ----------
  let heroSimpleMode = 'today';
  let heroSimplePick = null;

  function findTodaySimpleIdx(){
    const epoch = new Date(2025,0,1);
    const now = new Date();
    const days = Math.floor((new Date(now.getFullYear(),now.getMonth(),now.getDate()) - epoch) / 86400000);
    const start = ((days % STANDALONE_ROTATION.length) + STANDALONE_ROTATION.length) % STANDALONE_ROTATION.length;
    for(let step=0; step<STANDALONE_ROTATION.length; step++){
      const idx = (start + step) % STANDALONE_ROTATION.length;
      const entry = STANDALONE_ROTATION[idx];
      const q = THEMES[entry.themeIndex].standalone[entry.standaloneIndex];
      if(!isCoveredSimple(q.id)) return {rotIdx: idx, baseIdx: start};
    }
    return null;
  }

  function renderHeroSimple(){
    const hero = document.getElementById('heroCardSimple');
    let rotEntry, dayLabel, isToday;

    if(heroSimpleMode === 'today'){
      const found = findTodaySimpleIdx();
      if(!found){
        hero.innerHTML = `<div class="all-done">🎉 Toutes les questions isolées sont couvertes !
          <div class="hero-actions" style="justify-content:center;"><button class="btn" id="drawSimpleBtn">🎴 Piocher une question</button></div></div>`;
        document.getElementById('drawSimpleBtn').addEventListener('click', () => {
          heroSimplePick = Math.floor(Math.random()*STANDALONE_ROTATION.length); heroSimpleMode='random'; renderHeroSimple();
        });
        return;
      }
      rotEntry = STANDALONE_ROTATION[found.rotIdx];
      dayLabel = `${found.baseIdx+1} / ${STANDALONE_ROTATION.length}`;
      isToday = true;
    } else {
      rotEntry = STANDALONE_ROTATION[heroSimplePick];
      dayLabel = `${heroSimplePick+1} / ${STANDALONE_ROTATION.length}`;
      isToday = false;
    }
    const theme = THEMES[rotEntry.themeIndex];
    const q = theme.standalone[rotEntry.standaloneIndex];
    const done = isCoveredSimple(q.id);

    hero.innerHTML = `
      <div class="hero-top">
        <span class="hero-label">${isToday ? '○ Question isolée du jour' : '○ Pioche libre'}</span>
        <span class="hero-progress">${dayLabel}</span>
      </div>
      <div class="hero-theme">${escapeHtml(theme.header)} · <span class="freq" style="vertical-align:middle;">${q.freq}x</span></div>
      <h2>${escapeHtml(q.text)}</h2>
      ${pcBlockHTML(q.pourContre, 'heroSimple-'+q.id)}
      <div class="qlist" id="heroSimpleQlist"></div>
      <div class="hero-actions">
        <button class="cover-toggle ${done?'done':''}" id="heroSimpleCoverBtn">
          <span class="dot"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><polyline points="20 6 9 17 4 12"/></svg></span>
          ${done ? 'Couvert' : 'Marquer comme couvert'}
        </button>
        <button class="btn" id="drawSimpleBtn">🎴 Une autre</button>
        ${!isToday ? '<button class="btn" id="backTodaySimpleBtn">↩ Retour</button>' : ''}
      </div>
    `;
    const qlist = document.getElementById('heroSimpleQlist');
    const hasDetail = q.dates || (q.variants && q.variants.length);
    qlist.innerHTML = hasDetail ? `
      <div class="qrow">
        <div class="qhead" tabindex="0" role="button" aria-expanded="false" data-toggle="hs-0">
          <span class="qtext" style="color:var(--ink-soft);font-size:.85rem;">📅 Voir les dates et variantes</span>
          <svg class="chev" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"/></svg>
        </div>
        <div class="qdetail" id="hs-0">
          ${q.dates ? `<div class="canon-dates">📅 ${escapeHtml(q.dates)}</div>` : ''}
          ${(q.variants||[]).map(v => `<div class="variant"><span class="vtext">${escapeHtml(v.text)}</span><span class="vdates">📅 ${escapeHtml(v.dates)}</span></div>`).join('')}
        </div>
      </div>` : '';
    wireQuestionRows(qlist);
    wirePcToggles(hero);

    document.getElementById('heroSimpleCoverBtn').addEventListener('click', () => {
      toggleCoveredSimple(q.id);
      renderHeroSimple();
      renderIndex(currentSearchTerm());
    });
    document.getElementById('drawSimpleBtn').addEventListener('click', () => {
      let n;
      do { n = Math.floor(Math.random()*STANDALONE_ROTATION.length); } while(n === heroSimplePick && STANDALONE_ROTATION.length > 1);
      heroSimplePick = n; heroSimpleMode = 'random';
      renderHeroSimple();
    });
    const backBtn2 = document.getElementById('backTodaySimpleBtn');
    if(backBtn2) backBtn2.addEventListener('click', () => { heroSimpleMode = 'today'; renderHeroSimple(); });
  }

  // ---------- index ----------
  function clusterHTML(theme, cluster, tIdx, cIdx, term){
    const done = isCovered(cluster.id);
    return `
      <div class="cluster ${done?'covered':''}" data-theme="${tIdx}" data-cluster="${cIdx}" data-id="${cluster.id}">
        <div class="cluster-head" tabindex="0" role="button" aria-expanded="false">
          <span class="cluster-check ${done?'done':''}" role="checkbox" aria-checked="${done}" tabindex="0" title="Marquer comme couvert" data-cid="${cluster.id}">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><polyline points="20 6 9 17 4 12"/></svg>
          </span>
          <span class="cname">${highlight(cluster.name, term)}</span>
          <span class="cluster-meta">${cluster.count}q · ${cluster.total}x</span>
          <button class="show-card-btn" type="button" title="Afficher comme fiche en haut de page" data-show-cluster="${tIdx}:${cIdx}">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="16" rx="2"/><line x1="3" y1="9" x2="21" y2="9"/></svg>
          </button>
          <svg class="cluster-chev" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"/></svg>
        </div>
        <div class="cluster-body">
          <p class="cluster-arg">${escapeHtml(stripArgLabel(cluster.argument))}</p>
          ${pcBlockHTML(cluster.pourContre, 'idx-'+cluster.id)}
          <div class="qlist">
            ${cluster.questions.map((q,i) => questionRowHTML(q, `t${tIdx}c${cIdx}`, i, term)).join('')}
          </div>
        </div>
      </div>`;
  }

  function themeHTML(theme, tIdx, term){
    const clustersHtml = theme.clusters.map((c,ci) => clusterHTML(theme, c, tIdx, ci, term)).join('');
    const standaloneHtml = theme.standalone.length ? `
      <div class="standalone-block">
        <p class="standalone-title">Questions autonomes (${theme.standalone.length})</p>
        <div class="qlist">
          ${theme.standalone.map((q,i) => questionRowHTML(q, `t${tIdx}s`, i, term, q.id, `${tIdx}:${i}`)).join('')}
        </div>
      </div>` : '';
    const doneCount = theme.clusters.filter(c => isCovered(c.id)).length;
    return `
      <div class="theme" data-theme="${tIdx}">
        <div class="theme-head" tabindex="0" role="button" aria-expanded="false">
          <h3>${highlight(theme.header, term)}</h3>
          <span class="theme-meta">${doneCount}/${theme.clusters.length} groupes couverts · ${theme.totalQuestions} questions</span>
          <svg class="theme-chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"/></svg>
        </div>
        <div class="theme-body">
          ${clustersHtml}
          ${standaloneHtml}
        </div>
      </div>`;
  }

  let lastTerm = '';
  function currentSearchTerm(){ return lastTerm; }

  function renderIndex(term){
    lastTerm = term || '';
    const list = document.getElementById('themeList');
    list.innerHTML = THEMES.map((t,i) => themeHTML(t, i, term)).join('');
    wireQuestionRows(list);
    wirePcToggles(list);
    list.querySelectorAll('.theme-head').forEach(head => {
      head.addEventListener('click', () => toggleTheme(head));
      head.addEventListener('keydown', e => { if(e.key==='Enter'||e.key===' '){e.preventDefault(); toggleTheme(head);} });
    });
    list.querySelectorAll('.cluster-head').forEach(head => {
      head.addEventListener('click', (e) => {
        if(e.target.closest('.cluster-check') || e.target.closest('.show-card-btn')) return;
        toggleCluster(head);
      });
      head.addEventListener('keydown', e => { if(e.key==='Enter'||e.key===' '){e.preventDefault(); toggleCluster(head);} });
    });
    list.querySelectorAll('[data-show-cluster]').forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        const [ti, ci] = btn.dataset.showCluster.split(':').map(Number);
        showClusterAsCard(ti, ci);
      });
    });
    list.querySelectorAll('.cluster-check').forEach(chk => {
      chk.addEventListener('click', (e) => {
        e.stopPropagation();
        toggleCovered(chk.dataset.cid);
        renderIndex(lastTerm);
        applyHideCovered();
      });
      chk.addEventListener('keydown', e => {
        if(e.key==='Enter'||e.key===' '){
          e.preventDefault(); e.stopPropagation();
          toggleCovered(chk.dataset.cid);
          renderIndex(lastTerm);
          applyHideCovered();
        }
      });
    });
    applyHideCovered();
  }
  function toggleTheme(head){
    const el = head.closest('.theme');
    const open = el.classList.toggle('open');
    head.setAttribute('aria-expanded', open?'true':'false');
  }
  function toggleCluster(head){
    const el = head.closest('.cluster');
    const open = el.classList.toggle('open');
    head.setAttribute('aria-expanded', open?'true':'false');
  }

  function applyHideCovered(){
    const hide = document.getElementById('hideCoveredToggle').checked;
    document.querySelectorAll('.cluster[data-id]').forEach(el => {
      if(hide && el.classList.contains('covered')) el.style.display = 'none';
      else if(el.style.display === 'none' && !(document.getElementById('searchInput').value)) el.style.display = '';
    });
    document.querySelectorAll('.qrow[data-simple-id]').forEach(el => {
      if(hide && el.classList.contains('covered-simple')) el.style.display = 'none';
      else if(el.style.display === 'none' && !(document.getElementById('searchInput').value)) el.style.display = '';
    });
  }
  document.getElementById('hideCoveredToggle').addEventListener('change', () => {
    applySearch(document.getElementById('searchInput').value);
  });

  document.getElementById('resetProgress').addEventListener('click', () => {
    if(confirm('Réinitialiser toute la progression (fiches couvertes) ? Cette action est irréversible.')){
      covered = new Set();
      saveCovered(covered);
      updateProgress();
      heroMode = 'today';
      renderHero();
      applySearch(document.getElementById('searchInput').value);
    }
  });

  // ---------- search ----------
  function normalize(s){ return s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,''); }
  function matchesQuestion(q, term){
    if(normalize(q.text).includes(term)) return true;
    return (q.variants||[]).some(v => normalize(v.text).includes(term));
  }
  function applySearch(term){
    term = normalize(term.trim());
    const noResults = document.getElementById('noResults');
    if(!term){
      renderIndex('');
      document.querySelectorAll('.theme').forEach(t => t.classList.remove('open'));
      noResults.style.display = 'none';
      applyHideCovered();
      return;
    }
    renderIndex(term);
    let anyMatch = false;
    document.querySelectorAll('.theme').forEach((themeEl, tIdx) => {
      const theme = THEMES[tIdx];
      const themeMatches = normalize(theme.header).includes(term);
      let themeHasMatch = themeMatches;
      themeEl.querySelectorAll('.cluster').forEach((clusterEl, cIdx) => {
        const cluster = theme.clusters[cIdx];
        const clusterNameMatch = normalize(cluster.name).includes(term);
        const qMatch = cluster.questions.some(q => matchesQuestion(q, term));
        const hideCovered = document.getElementById('hideCoveredToggle').checked;
        const isCov = isCovered(cluster.id);
        const show = (themeMatches || clusterNameMatch || qMatch) && !(hideCovered && isCov);
        clusterEl.style.display = show ? '' : 'none';
        if(show){ themeHasMatch = true; if(clusterNameMatch || qMatch) clusterEl.classList.add('open'); }
      });
      const standaloneBlock = themeEl.querySelector('.standalone-block');
      if(standaloneBlock){
        const stMatch = theme.standalone.some(q => matchesQuestion(q, term));
        standaloneBlock.style.display = (themeMatches || stMatch) ? '' : 'none';
        if(stMatch) themeHasMatch = true;
      }
      themeEl.style.display = themeHasMatch ? '' : 'none';
      if(themeHasMatch){ themeEl.classList.add('open'); anyMatch = true; }
    });
    noResults.style.display = anyMatch ? 'none' : 'block';
  }
  document.getElementById('searchInput').addEventListener('input', e => applySearch(e.target.value));

  // ---------- init ----------
  renderHero();
  renderHeroSimple();
  renderIndex('');
  updateProgress();
  if(!storageOK || !storageOKSimple){
    const note = document.createElement('p');
    note.style.cssText = 'text-align:center;font-size:.78rem;color:var(--amber);margin-top:8px;';
    note.textContent = "⚠ Le stockage local n'est pas disponible ici (aperçu intégré ?). Ouvrez le fichier .html directement dans votre navigateur pour que la progression soit enregistrée.";
    document.querySelector('.wrap').insertBefore(note, document.getElementById('indexSection'));
  }
})();
</script>
</body>
</html>
